# Kinoseed's TMDB proxy on Cloudflare Workers (docs/DEVELOPMENT.md → The TMDB proxy). Deployed by
# .github/workflows/tmdb-proxy.yml; the key is the worker's secret TMDB_API_KEY, never in this file.
name = "kinoseed-tmdb"
main = "worker.ts"
compatibility_date = "2026-10-15"
workers_dev = true
preview_urls = false

# No request logs: the proxy sees each install's IP and what it searches for.
[observability]
enabled = false

# The calls that reach TMDB, per IP: 100 in 10 seconds covers Downloads guessing the titles of a long
# list (three searches at a time) and stops a script from pulling TMDB through Kinoseed's key.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 10 }
