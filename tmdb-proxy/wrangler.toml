# Kinoseed's TMDB proxy on Cloudflare Workers (docs/DEVELOPMENT.md → The TMDB proxy), as two workers
# that follow the builds calling them: `edge` goes out with every Kinoseed Edge build, `release` with
# every release (.github/workflows/tmdb-proxy.yml). The key is each worker's secret TMDB_API_KEY,
# never in this file. Bindings aren't inherited by an environment, so each one declares its own.
name = "kinoseed-tmdb"
main = "worker.ts"
compatibility_date = "2026-10-15"
workers_dev = true
preview_urls = false

# The calls that reach TMDB are limited per IP: 100 in 10 seconds covers Downloads guessing the
# titles of a long list (three searches at a time) and stops a script from pulling TMDB through
# Kinoseed's key. No request logs: the proxy sees each install's IP and what it searches for.

[env.edge]
name = "kinoseed-tmdb-edge"

[env.edge.observability]
enabled = false

[[env.edge.ratelimits]]
name = "LIMITER"
namespace_id = "1002"
simple = { limit = 100, period = 10 }

[env.release]
name = "kinoseed-tmdb"

[env.release.observability]
enabled = false

[[env.release.ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 100, period = 10 }
