# Runs the production image locally: `docker compose up --build`, then open http://localhost:8080.
# Reads QBITTORRENT_URL, TMDB_API_KEY, PROWLARR_URL, PROWLARR_API_KEY and the optional
# QBITTORRENT_USERNAME/QBITTORRENT_PASSWORD from .env.local (see .env.example).
services:
  kinoseed:
    build: .
    image: kinoseed:local
    env_file: .env.local
    ports:
      - "${KINOSEED_PORT:-8080}:8080"
    restart: unless-stopped
