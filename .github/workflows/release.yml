name: Release

# Pushing a tag like v0.1.0 builds the multi-arch image into GitHub Container Registry and
# creates a GitHub Release with that version's CHANGELOG.md section.
on:
  push:
    tags: ['v*']

# Read-only by default; the release job below pushes the image and creates the GitHub Release.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/kinopeer/kinopeer

jobs:
  release:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    # For a hang: a healthy run takes about 2 minutes. More room than Edge, since releases are rare
    # and one that times out has to be re-run by hand.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag and the changelog
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          awk -v heading="## $version" '
            /^## / { inside = ($0 == heading || index($0, heading " ") == 1); next }
            inside
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # No QEMU: the Dockerfile's runtime stage runs nothing, so arm64 builds here without emulation.
      # Buildx doesn't come from the GitHub Actions cache, which any job on main can write to, if the
      # action ever downloaded it (on ubuntu-latest it uses the runner's own); the image's build below
      # skips the cache for the same reason. BuildKit, which runs privileged and builds the image, is
      # pinned by digest, the same in ci.yml and edge.yml, and moved by hand
      # (docs/RELEASE_CHECKLIST.md → Before every release).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # GitHub detects the license from the text alone and reports GPL-3.0, which can't say "or later".
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - id: build
        name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No GitHub Actions cache: any job on main can write to it (CI runs npm ci with every dev
          # dependency there), so a layer planted in it would ship to every install. The image is
          # built only from the Dockerfile and the tag's code.

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo
            echo "**Image:** \`$IMAGE:$VERSION\`"
            echo
            echo "**Digest:** \`$IMAGE@$DIGEST\`"
          } >> release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "Kinopeer $VERSION" --notes-file release-notes.md --verify-tag

  # kinopeer-tmdb, which released versions call. After the image and the GitHub Release, which come
  # out only for a tag that matches package.json and the changelog; installs get the version only
  # with the store's update, later still.
  proxy:
    needs: release
    uses: ./.github/workflows/tmdb-proxy.yml
    with:
      environment: release
    # By name, since they live in the deploy environment (docs/DEVELOPMENT.md → The TMDB proxy), which
    # only the called job can name; nothing else this workflow can read goes along.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
