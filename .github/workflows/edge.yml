name: Edge

# Every push to main builds ghcr.io/kinopeer/kinopeer:edge for the Raspberry Pi and points the
# Kinopeer Edge app in the edge store at it, so umbrelOS offers it as an update within minutes
# (docs/DEVELOPMENT.md → Edge builds).
on:
  push:
    branches: [main]
    # What the image is built from, so a push that changes nothing in it publishes no update.
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - index.html
      - vite.config.ts
      - 'tsconfig*.json'
      - 'src/**'
      - 'server/**'
      - 'public/**'
      # The TMDB proxy Kinopeer Edge calls goes out with it (docs/DEVELOPMENT.md → The TMDB proxy).
      - 'tmdb-proxy/**'
      - .github/workflows/edge.yml
      - .github/workflows/tmdb-proxy.yml
      - '!**/*.test.ts'
      - '!**/*.test.tsx'
      - '!src/test/**'
      - '!server/test/**'
  # Builds main's head again, e.g. after a run whose store step failed.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kinopeer/kinopeer
  STORE: MrShakhov/umbrel-homelab-edge
  APP: homelab-edge-kinopeer

jobs:
  # kinopeer-tmdb-edge, before the image, so a path the new build calls is there when it starts.
  proxy:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tmdb-proxy.yml
    with:
      environment: edge
    secrets: inherit

  edge:
    needs: proxy
    # A dispatch can pick any branch; only main goes to the edge store.
    if: github.ref == 'refs/heads/main'
    # Squash merges often land in a row: only the newest one is built. On the job, not the
    # workflow, so a skipped dispatch from another branch doesn't cancel main's build.
    concurrency:
      group: edge
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # For a hang: a healthy run takes about 2 minutes, a build with nothing cached longer.
    timeout-minutes: 10
    # With pipefail, so a failed read of the store fails the run instead of looking like a first build.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The release notes list the commits since the build the store points at.
          fetch-depth: 0

      - id: check
        name: Check what the store runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse --short=7 HEAD)"
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "VERSION=$(node -p "require('./package.json').version")+$commit" >> "$GITHUB_ENV"
          # umbrelOS offers an update whenever the version differs from the installed one, so the
          # store never moves to this commit or an older one: a re-run of an earlier push would
          # offer a downgrade. Only one run at a time gets here, so the store can't change before
          # the last step.
          previous="$(gh api "repos/$STORE/contents/$APP/umbrel-app.yml" -H 'Accept: application/vnd.github.raw' | yq '.version' | sed -n 's/.*+//p')"
          if [ -n "$previous" ] && git cat-file -e "$previous^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor HEAD "$previous"; then
              echo "The edge store already points at $previous, which has this commit."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            range="$previous..HEAD"
          else
            range="-1"
          fi
          {
            echo 'NOTES<<END_OF_NOTES'
            git log --format='- %s' "$range"
            echo 'END_OF_NOTES'
          } >> "$GITHUB_ENV"
          echo "build=true" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.check.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        if: steps.check.outputs.build == 'true'
        name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          # The home server is a Raspberry Pi; release images are built for amd64 too.
          platforms: linux/arm64
          push: true
          # The edge worker the proxy job above deployed: Kinopeer Edge calls it, not the release one.
          build-args: |
            KINOPEER_COMMIT=${{ env.COMMIT }}
            KINOPEER_TMDB_PROXY=https://kinopeer-tmdb-edge.kinoseed.workers.dev/3
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:sha-${{ env.COMMIT }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,scope=edge,mode=max

      - if: steps.check.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.STORE }}
          # A deploy key with write access to the edge store only.
          ssh-key: ${{ secrets.EDGE_STORE_DEPLOY_KEY }}
          path: store

      - if: steps.check.outputs.build == 'true'
        name: Point Kinopeer Edge at the new image
        working-directory: store/${{ env.APP }}
        env:
          IMAGE_REF: ${{ env.IMAGE }}:sha-${{ env.COMMIT }}@${{ steps.build.outputs.digest }}
        run: |
          yq -i '.version = strenv(VERSION) | .releaseNotes = strenv(NOTES)' umbrel-app.yml
          yq -i '.services.web.image = strenv(IMAGE_REF)' docker-compose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Kinopeer Edge $VERSION"
          git push
