name: Edge

# A push to main whose build's fingerprint differs from the image the edge store runs (what the image
# runs and how it's built, scripts/edge/fingerprint.ts) builds ghcr.io/kinopeer/kinopeer:edge for the
# Raspberry Pi and points the Kinopeer Edge app in the edge store at it, so umbrelOS offers it as an
# update within minutes (docs/DEVELOPMENT.md → Edge builds).
on:
  push:
    branches: [main]
    # What the image is built from, so a push that changes nothing in it publishes no update.
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - index.html
      - vite.config.ts
      - 'tsconfig*.json'
      - 'src/**'
      - 'server/**'
      - 'public/**'
      # The TMDB proxy Kinopeer Edge calls goes out with it (docs/DEVELOPMENT.md → The TMDB proxy).
      - 'tmdb-proxy/**'
      - .github/workflows/edge.yml
      - .github/workflows/tmdb-proxy.yml
      - '!**/*.test.ts'
      - '!**/*.test.tsx'
      - '!src/test/**'
      - '!server/test/**'
  # Builds main's head again, e.g. after a run whose store step failed.
  workflow_dispatch:

# Read-only by default; the edge job below pushes the image.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/kinopeer/kinopeer
  STORE: MrShakhov/umbrel-homelab-edge
  APP: homelab-edge-kinopeer
  # The edge worker the proxy job below deploys: Kinopeer Edge calls it, not the release one.
  PROXY: https://tmdb-edge.kinopeer.com/3
  # The label that carries an edge image's fingerprint (scripts/edge/fingerprint.ts).
  FINGERPRINT_LABEL: com.kinopeer.fingerprint

jobs:
  # kinopeer-tmdb-edge, before the image, so a path the new build calls is there when it starts.
  proxy:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tmdb-proxy.yml
    with:
      environment: edge
    # By name, since they live in the deploy environment (docs/DEVELOPMENT.md → The TMDB proxy), which
    # only the called job can name; nothing else this workflow can read goes along.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

  # What the image would run, as a hash, so the edge job publishes only a build that runs something
  # new (docs/DEVELOPMENT.md → Edge builds). A job of its own with nothing to write and no secrets,
  # since it installs the dependencies and runs the build on the runner.
  fingerprint:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # Without KINOPEER_COMMIT, which every edge build bakes into the app.
      - run: npm run build
      # Through a variable, so a failing script fails the step rather than writing an empty hash.
      - id: hash
        run: |
          hash="$(node scripts/edge/fingerprint.ts dist "$PROXY")"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

  edge:
    needs: [proxy, fingerprint]
    # A dispatch can pick any branch; only main goes to the edge store.
    if: github.ref == 'refs/heads/main'
    # Squash merges often land in a row: only the newest one is built. On the job, not the
    # workflow, so a skipped dispatch from another branch doesn't cancel main's build.
    concurrency:
      group: edge
      cancel-in-progress: true
    # The edge store's deploy key lives in the deploy environment, which only main and v* tags can read.
    environment: deploy
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    # For a hang: a healthy run takes about 2 minutes, a build with nothing cached longer.
    timeout-minutes: 10
    # With pipefail, so a failed read of the store fails the run instead of looking like a first build.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes list the commits since the build the store points at.
          fetch-depth: 0
          # Nothing pushes to this repository; the store is pushed to with its own key below.
          persist-credentials: false

      - id: check
        name: Check what the store runs
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ needs.fingerprint.outputs.hash }}
        run: |
          commit="$(git rev-parse --short=7 HEAD)"
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "VERSION=$(node -p "require('./package.json').version")+$commit" >> "$GITHUB_ENV"
          # umbrelOS offers an update whenever the version differs from the installed one, so the
          # store never moves to this commit or an older one: a re-run of an earlier push would
          # offer a downgrade. Only one run at a time gets here, so the store can't change before
          # the last step.
          previous="$(gh api "repos/$STORE/contents/$APP/umbrel-app.yml" -H 'Accept: application/vnd.github.raw' | yq '.version' | sed -n 's/.*+//p')"
          if [ -n "$previous" ] && git cat-file -e "$previous^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor HEAD "$previous"; then
              echo "The edge store already points at $previous, which has this commit."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            range="$previous..HEAD"
          else
            range="-1"
          fi
          # A build that runs the same as the image the store points at publishes nothing: no update
          # on the Umbrel and no reload of an open Kinopeer Edge for a comment, a test or a tool. An
          # image that can't be read (gone from the registry) leaves it to the build.
          if [ -z "$FINGERPRINT" ]; then
            echo "::error::The fingerprint job gave no fingerprint."
            exit 1
          fi
          image="$(gh api "repos/$STORE/contents/$APP/docker-compose.yml" -H 'Accept: application/vnd.github.raw' | yq '.services.web.image')"
          if config="$(docker buildx imagetools inspect "$image" --format '{{json .Image}}')"; then
            found="$(jq -r --arg label "$FINGERPRINT_LABEL" '.config.Labels[$label] // empty' <<< "$config")"
            if [ "$found" = "$FINGERPRINT" ]; then
              echo "The edge store's image runs the same as this commit would (fingerprint $FINGERPRINT)."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Said, so a check that stopped matching (the label renamed, an image index) shows.
            echo "The edge store's image has fingerprint ${found:-none}, this commit $FINGERPRINT; building."
          else
            echo "::warning::Couldn't read the edge store's image $image; building."
          fi
          {
            echo 'NOTES<<END_OF_NOTES'
            git log --format='- %s' "$range"
            echo 'END_OF_NOTES'
          } >> "$GITHUB_ENV"
          echo "build=true" >> "$GITHUB_OUTPUT"

      # No QEMU: the Dockerfile's runtime stage runs nothing, so arm64 builds here without emulation.
      # BuildKit is pinned as in release.yml, which says why.
      - if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - if: steps.check.outputs.build == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        if: steps.check.outputs.build == 'true'
        name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # The home server is a Raspberry Pi; release images are built for amd64 too.
          platforms: linux/arm64
          push: true
          build-args: |
            KINOPEER_COMMIT=${{ env.COMMIT }}
            KINOPEER_TMDB_PROXY=${{ env.PROXY }}
          labels: ${{ env.FINGERPRINT_LABEL }}=${{ needs.fingerprint.outputs.hash }}
          # No provenance attestation: only the owner installs edge images, and each one would add two
          # untagged versions to the package. Release images keep theirs.
          provenance: false
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:sha-${{ env.COMMIT }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,scope=edge,mode=max

      - if: steps.check.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.STORE }}
          # A deploy key with write access to the edge store only.
          ssh-key: ${{ secrets.EDGE_STORE_DEPLOY_KEY }}
          path: store

      - if: steps.check.outputs.build == 'true'
        name: Point Kinopeer Edge at the new image
        working-directory: store/${{ env.APP }}
        env:
          IMAGE_REF: ${{ env.IMAGE }}:sha-${{ env.COMMIT }}@${{ steps.build.outputs.digest }}
        run: |
          yq -i '.version = strenv(VERSION) | .releaseNotes = strenv(NOTES)' umbrel-app.yml
          yq -i '.services.web.image = strenv(IMAGE_REF)' docker-compose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Kinopeer Edge $VERSION"
          git push
