name: Guard

# The checks guard on every PR (docs/QUALITY.md → The checks guard): main's copy of scripts/guard/
# reads the PR's branch through git and writes into the PR's `guard` check what in it weakens the
# checks, changes existing ones or adds a design value; the check waits, in progress, while a list
# of its marks lacks the record it calls for (docs/QUALITY.md → What a marked PR needs). The script is main's; this file isn't: on pull_request GitHub runs the
# workflow as the PR has it, so a PR that changes these steps runs them changed, and main's script
# marks the change for the owner.
#
# Two jobs, so the PR's code never runs where the token can write: `tests` runs the tests of both
# sides for the lists of what ran, with a token that can only read; `report` runs only main's script,
# over the branch as git has it and over those lists, which to it are data. What the PR's code can
# still write from `tests` is its artifact and the Actions cache in the PR's scope, so `report` takes
# the first as data and nothing from the second.
on:
  pull_request:

# Read-only by default; the `report` job may write the guard's check.
permissions:
  contents: read

# A push to a PR cancels the PR's run in progress, since only its head matters.
concurrency:
  group: guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    # Two installs and two runs of the unit tests, a few minutes in all.
    timeout-minutes: 15
    steps:
      - name: Check out the PR's branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Whole, to find the commit where it left main.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pr/package-lock.json
      - name: Run each side's tests for the list of what ran
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # main's side is the commit the branch left main at, as in the guard, so a test main gained
        # since isn't one the branch lost. The unit tests are run, since only a run has a table's
        # every row and knows a skipped test; the browser tests are listed, which Playwright does
        # the same way without a browser. A failing test is still a test that ran, and CI's own
        # jobs are the ones that fail for it. The paths are cut to start at the repository's root,
        # so the two sides name a file alike.
        run: |
          git -C pr worktree add --detach ../base "$(git -C pr merge-base "$BASE" "$HEAD")"
          for side in base pr; do
            mkdir -p "lists/$side"
            (
              cd "$side"
              npm ci
              npx vitest run --reporter=json --outputFile="../lists/$side/vitest.json" || echo "::notice::$side: not every unit test passed"
              npx playwright test --list --reporter=json > "../lists/$side/playwright.json"
              npx playwright test --config playwright.smoke.config.ts --list --reporter=json > "../lists/$side/playwright.smoke.json"
              # The requests budget's config, on the sides that have it (#378 added it).
              if [ -f playwright.performance.config.ts ]; then
                npx playwright test --config playwright.performance.config.ts --list --reporter=json > "../lists/$side/playwright.performance.json"
              fi
              sed -i "s|$PWD/||g" "../lists/$side"/*.json
            )
          done
      - name: Hand the lists to the guard
        # Whatever there is, also after a step above failed: the guard says which side has no list.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests
          path: lists
          retention-days: 14

  # Not named `guard`: that is the check run the job writes, which the ruleset on main requires, so
  # the job's own check passes once the guard has run and the PR waits on the check run alone.
  report:
    needs: tests
    # Also after the tests' job failed: the guard then says it has no lists, where a job that is
    # skipped would say nothing and pass.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The PR's comments, for its records.
      pull-requests: read
      checks: write
    steps:
      - name: Check out the PR's branch, to read
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch itself rather than its merge with main, whole, so the guard can find where it
          # left main. Nothing in it is run in this job: no npm ci, none of its scripts.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          # The token can write checks.
          persist-credentials: false
      - name: Check out main, to run its guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main
          persist-credentials: false
      # Node runs the guard's TypeScript as it is. No `cache:` here: the `tests` job, where the PR's
      # code runs, can save a cache in this PR's scope under any key, a restore looks there before
      # main's, and what it unpacks could overwrite main's script or this job's actions.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install what main's guard imports
        # The parser it reads test files with comes with Vite: main's lockfile, none of the
        # packages' install scripts, nothing from the cache.
        working-directory: main
        run: npm ci --ignore-scripts
      - name: Get the lists of the tests that ran
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        # With no lists to get, the guard still runs and says it can't see which tests are gone.
        continue-on-error: true
        with:
          name: tests
          path: lists
      - name: Read the PR's comments, for its records
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # One a line, as data for main's script: what its author is to the repository, and its text.
        # GitHub answers the first by who asks (a member whose membership is private is a
        # collaborator to a reader outside the organization), so the log says how this job's token
        # sees the authors: a record counts only from a member or an invited collaborator.
        run: |
          gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | {association: .author_association, body}' > comments.jsonl
          jq -r .association comments.jsonl | sort | uniq -c
      - name: Run the guard
        id: guard
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # main's copy, so a PR that changes the guard is still read by the guard it found.
        run: |
          node main/scripts/guard/guard.ts --repo pr --base "$BASE" --head "$HEAD" --tests-base lists/base --tests-head lists/pr --comments comments.jsonl > guard.md
          cat guard.md >> "$GITHUB_STEP_SUMMARY"
      - name: Write the findings into the guard's check
        # A check run rather than a comment, and one that waits rather than fails while a list lacks
        # its record: a comment emails the PR's participants and a failed run its author, every push
        # and every re-run, while a check run in progress emails no one and holds the merge all the
        # same. A fork's PR gets a read-only token whatever the permissions above say, so it gets no
        # check and can't merge as it is (docs/QUALITY.md → How it runs); the job summary still has
        # the findings.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          UNMET: ${{ steps.guard.outputs.unmet }}
          # A main whose guard has no coordinator's list yet gives no count for it, which is none.
          FOUND: ${{ steps.guard.outputs.owner != '0' || (steps.guard.outputs.coordinator || '0') != '0' || steps.guard.outputs.review != '0' }}
        # A new check run on every run, re-runs included: GitHub goes by the latest of a name.
        run: |
          if [ "$UNMET" = true ]; then
            state=(-f status=in_progress)
            title='Waiting for records'
          elif [ "$FOUND" = true ]; then
            state=(-f status=completed -f conclusion=success)
            title='Every list of marks holds its record'
          else
            state=(-f status=completed -f conclusion=success)
            title='Nothing marked'
          fi
          gh api "repos/$REPO/check-runs" --silent -f name=guard -f head_sha="$HEAD" "${state[@]}" \
            -f "output[title]=$title" -F 'output[summary]=@guard.md'
