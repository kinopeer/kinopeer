name: Mutants

# A run for the latest head of a ready PR: when it's opened ready, marked ready or pushed to (a fix, a
# merge of main), or when started by hand (docs/TESTING.md → A test that can fail). Survivors don't
# fail the job; its "Mutants report" check on the commit, at the head a review round sees, is the
# count the round compares with the PR's Mutants line and the author's answer: a check rather than a
# comment on the PR, which emailed its author on every push. A PR that changes only Stryker's setup
# or the dependencies gets Stryker's dry run (scripts/mutants.mjs), so a bump that breaks it fails
# here (#285).
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths:
      - 'src/**'
      - 'server/**'
      # scripts/mutants.mjs mutates these too.
      - 'tmdb-proxy/**'
      # What Stryker runs with, each of which can break it without a line to mutate.
      - 'package.json'
      - 'package-lock.json'
      - 'stryker.config.mjs'
      - 'vite.config.ts'
      - 'scripts/mutants.mjs'
      - '.github/workflows/mutants.yml'
  workflow_dispatch:

# Read-only by default; the job below may add a check to the commit.
permissions:
  contents: read

# A push while a run is going cancels it, so only the latest head is mutated and reported on. Keyed
# by the head repository and the branch, so a run started by hand and a push's run for the same PR
# share the group (a dispatch has no PR: this repository and its branch), while PRs from forks whose
# branches share a name (patch-1, main) don't cancel each other. A push to a draft PR joins it too:
# its run does nothing (the job skips drafts) but still cancels a run started by hand in progress.
concurrency:
  group: mutants-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  mutants:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch itself rather than its merge with main, whole, so the script can find the
          # lines the branch changed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # The token can add checks to commits, and `npm ci` and the branch's own code run after
          # this.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: mutants
        run: npm run --silent test:mutants > mutants.md
      - run: cat mutants.md >> "$GITHUB_STEP_SUMMARY"
      - name: Report the survivors as a check on the commit
        # A fork's PR gets a read-only token, and the job summary above still has them.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          GH_TOKEN: ${{ github.token }}
          # The commit mutated, which a run started by hand has as its own.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          # Neutral while something survived, so the PR's checks show it without failing, and when
          # the script gave no count.
          CONCLUSION: ${{ steps.mutants.outputs.survived == '0' && 'success' || 'neutral' }}
        # The report's first line, without its bold, is the check's title, the whole report its
        # summary.
        run: |
          gh api "repos/$REPO/check-runs" --silent -f name='Mutants report' -f head_sha="$SHA" \
            -f status=completed -f conclusion="$CONCLUSION" \
            -f "output[title]=$(head -n 1 mutants.md | tr -d '*')" -F 'output[summary]=@mutants.md'
