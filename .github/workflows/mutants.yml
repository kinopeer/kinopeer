name: Mutants

# A run for the latest head of a ready PR: when it's opened ready, marked ready or pushed to (a fix, a
# merge of main), or when started by hand (docs/TESTING.md → A test that can fail). Survivors don't
# fail the job; its comment, at the head a review round sees, is the count the round compares with
# the PR's Mutants line and the author's answer. A PR that changes only Stryker's setup or the
# dependencies gets Stryker's dry run (scripts/mutants.mjs), so a bump that breaks it fails here (#285).
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
    paths:
      - 'src/**'
      - 'server/**'
      # scripts/mutants.mjs mutates these too.
      - 'tmdb-proxy/**'
      # What Stryker runs with, each of which can break it without a line to mutate.
      - 'package.json'
      - 'package-lock.json'
      - 'stryker.config.mjs'
      - 'vite.config.ts'
      - 'scripts/mutants.mjs'
      - '.github/workflows/mutants.yml'
  workflow_dispatch:

# A push while a run is going cancels it, so only the latest head is mutated and commented on. Keyed
# by the branch, so a run started by hand and a push's run for the same PR share the group.
concurrency:
  group: mutants-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  mutants:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch itself rather than its merge with main, whole, so the script can find the
          # lines the branch changed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # The token can write to PRs, and `npm ci` and the branch's own code run after this.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run --silent test:mutants > mutants.md
      - run: cat mutants.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post the survivors on the PR
        # A fork's PR gets a read-only token, and the job summary above still has them.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          pr=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$pr" ]; then gh pr comment "$pr" --body-file mutants.md; fi
