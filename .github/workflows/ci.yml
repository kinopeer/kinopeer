name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only whatever the repository's default for the token: no job writes to GitHub. Checkouts don't
# keep the token in .git either (persist-credentials), since npm ci and the branch's code run after them.
permissions:
  contents: read

# A push to a PR cancels the PR's run in progress, whoever's fork it comes from, since only its head
# matters. Each push to main gets a group of its own (its commit) and is never cancelled: every commit
# of main is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job's timeout-minutes is there for a hang, which would otherwise run to GitHub's six hours and
# spend the account's minutes: well over the slowest healthy run, so raise it if a job's normal time
# gets near it rather than retrying.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=html --coverage.reporter=json-summary
      - name: Add the coverage totals to the job summary
        # When the tests fail, this shows what they still covered; when they never ran (a lint or
        # type error), there is no report and nothing to add.
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node scripts/coverage-summary.mjs coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage report: the tests didn't run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the HTML coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          retention-days: 14
      - run: npm run build

  performance:
    # The speed budgets in checks.json (docs/QUALITY.md): the build's size, then what each screen asks
    # the servers for when it opens and each move between screens asks for, each with a table in the
    # job's summary. No screenshots, so a
    # plain runner with Chromium, as the smoke journeys have.
    runs-on: ubuntu-latest
    # Usually a few minutes, but apt alone has taken 550 s on a runner like this one.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The build's size against budgets.size (docs/QUALITY.md → The size budget).
      - run: npm run size
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Each screen's requests on opening and each move's between screens, against budgets.requests
      # and budgets.journeys, on the build above (docs/QUALITY.md → The requests budget).
      - run: npm run test:requests
      - name: Upload the report with the traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-performance
          path: |
            playwright-report
            test-results
          retention-days: 14

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Baselines in e2e/__screenshots__ are rendered in this image (scripts/playwright-docker.sh); keep its
    # tag on the @playwright/test version from package.json, pinned by the digest that tag names.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci
      - run: npx playwright test
      - name: Upload the report with the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  smoke:
    # The smoke journeys through the production server (docs/TESTING.md → Smoke journeys): no
    # screenshots, so a plain runner with Chromium, not the Playwright image.
    runs-on: ubuntu-latest
    # Usually a minute, but apt alone has taken 550 s here.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Chromium
        id: chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system libraries
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:smoke
      - name: Upload the report with the traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-smoke
          path: |
            playwright-report
            test-results
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    # Room for a build with nothing cached, which the 100 s of the slowest recent run doesn't show.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The BuildKit release.yml and edge.yml build with, so its bump is tried here first.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: kinopeer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name kinopeer -p 8080:8080 kinopeer:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          # The data folder takes the settings as the image's user (the Dockerfile's --chown).
          docker exec kinopeer touch /data/.probe
          curl -fs http://localhost:8080/title/movie/771 | grep -q '<div id="root">'
          docker stop kinopeer
