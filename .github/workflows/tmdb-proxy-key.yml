name: TMDB proxy key

# Puts the TMDB_API_KEY repository secret into the TMDB proxy workers without deploying their code:
# run it from the Actions tab after replacing a leaked or revoked key, and installs keep working
# without a release (docs/DEVELOPMENT.md → The TMDB proxy). That includes the workers from before the
# rename to Kinopeer, which versions up to 0.7 still call.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  key:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # A worker that doesn't take the key doesn't stop the others from taking it.
      fail-fast: false
      matrix:
        # wrangler.jsonc's environments, then by name the workers Kinoseed (up to 0.7) calls, which
        # are no longer deployed from here. Take a worker out of this list before deleting it in
        # Cloudflare: `secret put` on a worker that doesn't exist creates an empty one of that name.
        # (Harmless for kinopeer-tmdb before the first release after the rename: its deploy fills it.)
        # Unquoted in the command below, so each entry splits into the flag and its value.
        worker: ['--env edge', '--env release', '--name kinoseed-tmdb-edge', '--name kinoseed-tmdb']
    # The Cloudflare token only in the steps that call Cloudflare, not while npm installs Wrangler.
    steps:
      # For wrangler.jsonc, which names each environment's worker.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Wrangler and its dependencies exactly as tmdb-proxy/package-lock.json names them.
      - name: Install Wrangler
        working-directory: tmdb-proxy
        run: npm ci --no-audit --no-fund

      # From stdin, so the key shows in no command line or log.
      - name: Set the key
        working-directory: tmdb-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::The TMDB_API_KEY repository secret isn't set"
            exit 1
          fi
          printf '%s' "$TMDB_API_KEY" | npx wrangler secret put TMDB_API_KEY ${{ matrix.worker }}
