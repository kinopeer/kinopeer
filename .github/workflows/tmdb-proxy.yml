name: TMDB proxy

# Deploys Kinopeer's TMDB proxy (tmdb-proxy/) to Cloudflare Workers and gives it the key, which lives
# in the deploy environment's secrets and the worker's, never in the code or the image. It has no trigger of
# its own: Edge runs it for kinopeer-tmdb-edge with every edge run, and Release for kinopeer-tmdb
# with every release, so each worker goes out with the builds that call it, whatever starts them
# (docs/DEVELOPMENT.md → The TMDB proxy). A worker that already runs what a deploy would put on it
# (its version's tag is the same fingerprint) gets no new version, only its routes applied again.
on:
  workflow_call:
    inputs:
      environment:
        description: '`edge` (main, called by Kinopeer Edge) or `release` (the newest tag, called by released versions)'
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      TMDB_API_KEY:
        required: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    concurrency:
      group: tmdb-proxy-${{ inputs.environment }}
      cancel-in-progress: false
    # GitHub's environment that holds the secrets and lets only main and v* tags read them, not
    # inputs.environment, which is the worker's in wrangler.jsonc.
    environment: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Cloudflare token only in the steps that call Cloudflare, not while npm installs Wrangler.
    env:
      ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main's head and the tags, to tell whether this is the newest code for the worker.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          [ -n "$TMDB_API_KEY" ] || missing+=(TMDB_API_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets not set in the deploy environment: ${missing[*]}"
            exit 1
          fi

      # Wrangler and its dependencies exactly as tmdb-proxy/package-lock.json names them.
      - name: Install Wrangler
        working-directory: tmdb-proxy
        run: npm ci --no-audit --no-fund

      # What a deploy would put on the worker, without deploying it and without the Cloudflare token,
      # and the files it's built from (esbuild's metafile, kept out of the bundle the fingerprint hashes).
      - name: Bundle the worker
        working-directory: tmdb-proxy
        run: npx wrangler deploy --dry-run --env "$ENVIRONMENT" --outdir "$RUNNER_TEMP/worker" --metafile "$RUNNER_TEMP/worker-meta.json" > /dev/null

      # Only the newest proxy code for this worker: what the bundle is built from and how it's deployed
      # (tmdb-proxy/deployCheck.ts says why and how).
      - id: newest
        name: Check this is the newest code for the worker
        run: |
          result="$(node tmdb-proxy/deployCheck.ts "$ENVIRONMENT" "$RUNNER_TEMP/worker-meta.json")"
          echo "$result" >> "$GITHUB_OUTPUT"
          [ "$result" = deploy=true ] || echo "::notice::The $ENVIRONMENT worker stays as it is (the reason is in this step's log)."

      # The bundle's fingerprint (tmdb-proxy/fingerprint.ts: Wrangler's bundle, its config, Wrangler's
      # version and this workflow; not the key, which tmdb-proxy-key.yml changes), against the tag of
      # the version the worker runs: the same gets no new version, so a run that changes nothing in the
      # proxy adds none. A worker or version that can't be read deploys anyway.
      - id: deployed
        name: Compare with the version the worker runs
        if: steps.newest.outputs.deploy == 'true'
        working-directory: tmdb-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fingerprint="$(node fingerprint.ts "$RUNNER_TEMP/worker")"
          if [[ ! "$fingerprint" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::tmdb-proxy/fingerprint.ts gave no fingerprint: '$fingerprint'."
            exit 1
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          # A failure to read is a warning, kept apart from a version that has no tag, so a Wrangler
          # update that changes either answer (a call, its JSON or a field it has) shows instead of
          # quietly deploying on every run: jq fails on a field that's gone rather than reading none.
          found=""
          if ! status="$(npx wrangler deployments status --env "$ENVIRONMENT" --json)"; then
            echo "::warning::Couldn't ask Cloudflare which version the $ENVIRONMENT worker runs; deploying."
          elif ! version="$(jq -r 'if (.versions | type) == "array" and all(.versions[]; has("percentage") and has("version_id")) then [.versions[] | select(.percentage == 100) | .version_id][0] // empty else error("no versions with their traffic") end' <<< "$status")"; then
            echo "::warning::Couldn't read the $ENVIRONMENT worker's deployment; deploying."
          elif [ -z "$version" ]; then
            echo "No version of the $ENVIRONMENT worker serves all its traffic; deploying."
          elif ! view="$(npx wrangler versions view "$version" --env "$ENVIRONMENT" --json)"; then
            echo "::warning::Couldn't ask Cloudflare for version $version of the $ENVIRONMENT worker; deploying."
          elif ! found="$(jq -r 'if (.annotations | type) == "object" then .annotations["workers/tag"] // empty else error("no annotations") end' <<< "$view")"; then
            found=""
            echo "::warning::Couldn't read the tag of version $version of the $ENVIRONMENT worker; deploying."
          fi
          if [ "$found" = "$fingerprint" ]; then
            echo "::notice::The $ENVIRONMENT worker already runs this proxy (fingerprint $fingerprint)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "The $ENVIRONMENT worker runs fingerprint ${found:-none}, this commit $fingerprint; deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      # The code and the key as one version, so the worker never runs without the key, even right
      # after its first deploy, and Cloudflare lists one deployment per run. The key goes through a
      # file only this user can read, written from the environment (so it shows in no command line or
      # log) in the runner's temp folder and deleted when the step ends. The version's tag is the
      # fingerprint the step above compares.
      - name: Deploy with the key
        if: steps.deployed.outputs.deploy == 'true'
        working-directory: tmdb-proxy
        env:
          FINGERPRINT: ${{ steps.deployed.outputs.fingerprint }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          umask 077
          secrets="$RUNNER_TEMP/tmdb-proxy-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          node -e 'process.stdout.write(JSON.stringify({ TMDB_API_KEY: process.env.TMDB_API_KEY }))' > "$secrets"
          npx wrangler deploy --env "$ENVIRONMENT" --secrets-file "$secrets" --tag "$FINGERPRINT"

      # A deploy uploads the version and puts it at 100% before it attaches the Custom Domain and sets
      # workers.dev and Preview URLs, so one that failed after the upload leaves a tagged version
      # without its address, and a dashboard change to them would stay. A run that doesn't deploy
      # applies them again from wrangler.jsonc, which makes no version (Wrangler's
      # `triggers deploy`, marked experimental). The script's settings, observability and Workers Cache
      # among them, aren't: a change to them in the dashboard stays until the next deploy
      # (docs/DEVELOPMENT.md → The TMDB proxy).
      - name: Apply the routes again
        if: steps.deployed.outputs.deploy == 'false'
        working-directory: tmdb-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler triggers deploy --env "$ENVIRONMENT"
